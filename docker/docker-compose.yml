version: '3.8'

# ============================================================
#  Instacart Big Data Cluster — Docker Compose
#  Stack: Hadoop 3.4.3 · Spark 4.1.1 · Kafka 4.1.2 (KRaft)
#  Apply VERSION_PATCH.md before use
# ============================================================

networks:
  bigdata-net:
    driver: bridge

# ─────────────────────────────────────────────────────────────
#  HADOOP NAMENODE
# ─────────────────────────────────────────────────────────────
services:
  namenode:
    build:
      context: ./hadoop
      dockerfile: Dockerfile
    image: instacart-hadoop:3.4.3
    container_name: namenode
    hostname: namenode
    ports:
      - "9870:9870"   # NameNode Web UI  → http://localhost:9870
      - "9000:9000"   # HDFS RPC
      - "8088:8088"   # YARN ResourceManager Web UI → http://localhost:8088
    networks:
      - bigdata-net
    environment:
      HADOOP_ROLE: namenode
      HDFS_NAMENODE: hdfs://namenode:9000
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
      - hadoop_tmp:/hadoop/tmp
    healthcheck:
      test: ["CMD", "hdfs", "dfsadmin", "-safemode", "get"]
      interval: 30s
      timeout: 10s
      retries: 5

# ─────────────────────────────────────────────────────────────
#  HADOOP DATANODE 1
# ─────────────────────────────────────────────────────────────
  datanode1:
    build:
      context: ./hadoop
      dockerfile: Dockerfile
    image: instacart-hadoop:3.4.3
    container_name: datanode1
    hostname: datanode1
    networks:
      - bigdata-net
    environment:
      HADOOP_ROLE: datanode
      SERVICE_PRECONDITION: "namenode:9870"
    volumes:
      - hadoop_datanode1:/hadoop/dfs/data
    depends_on:
      namenode:
        condition: service_started

# ─────────────────────────────────────────────────────────────
#  HADOOP DATANODE 2
# ─────────────────────────────────────────────────────────────
  datanode2:
    build:
      context: ./hadoop
      dockerfile: Dockerfile
    image: instacart-hadoop:3.4.3
    container_name: datanode2
    hostname: datanode2
    networks:
      - bigdata-net
    environment:
      HADOOP_ROLE: datanode
      SERVICE_PRECONDITION: "namenode:9870"
    volumes:
      - hadoop_datanode2:/hadoop/dfs/data
    depends_on:
      namenode:
        condition: service_started

# ─────────────────────────────────────────────────────────────
#  SPARK MASTER
#  PATCH 6: apache/spark:4.1.1 hoặc custom Dockerfile
# ─────────────────────────────────────────────────────────────
  spark-master:
    build:
      context: ./spark
      dockerfile: Dockerfile
    image: instacart-spark:4.1.1
    container_name: spark-master
    hostname: spark-master
    ports:
      - "8080:8080"   # Spark Web UI  → http://localhost:8080
      - "7077:7077"   # Spark Master RPC
      - "4040:4040"   # Spark Application UI
    networks:
      - bigdata-net
    environment:
      SPARK_MODE: master
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
    volumes:
      - ./spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro

# ─────────────────────────────────────────────────────────────
#  SPARK WORKER 1
# ─────────────────────────────────────────────────────────────
  spark-worker-1:
    build:
      context: ./spark
      dockerfile: Dockerfile
    image: instacart-spark:4.1.1
    container_name: spark-worker-1
    hostname: spark-worker-1
    ports:
      - "8081:8081"   # Worker Web UI
    networks:
      - bigdata-net
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_WEBUI_PORT: 8081
    volumes:
      - ./spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    depends_on:
      - spark-master

# ─────────────────────────────────────────────────────────────
#  SPARK WORKER 2
# ─────────────────────────────────────────────────────────────
  spark-worker-2:
    build:
      context: ./spark
      dockerfile: Dockerfile
    image: instacart-spark:4.1.1
    container_name: spark-worker-2
    hostname: spark-worker-2
    ports:
      - "8082:8081"   # Worker Web UI (mapped to 8082 on host)
    networks:
      - bigdata-net
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2G
      SPARK_WORKER_CORES: "2"
      SPARK_WORKER_WEBUI_PORT: 8081
    volumes:
      - ./spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    depends_on:
      - spark-master

# ─────────────────────────────────────────────────────────────
#  KAFKA 4.1.2 — KRaft mode (NO Zookeeper!)
#  PATCH 4: Bỏ hoàn toàn Zookeeper, dùng apache/kafka:4.1.2
# ─────────────────────────────────────────────────────────────
  kafka:
    image: apache/kafka:4.1.2
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"   # External access from host
    networks:
      - bigdata-net
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

# ─────────────────────────────────────────────────────────────
#  JUPYTER NOTEBOOK SERVER
#  PATCH 5: python:3.11 + pyspark==4.1.1 (custom Dockerfile)
# ─────────────────────────────────────────────────────────────
  jupyter:
    build:
      context: ./jupyter
      dockerfile: Dockerfile
    container_name: jupyter
    hostname: jupyter
    ports:
      - "8888:8888"   # Jupyter → http://localhost:8888
    networks:
      - bigdata-net
    environment:
      SPARK_MASTER: spark://spark-master:7077
      HDFS_NAMENODE: hdfs://namenode:9000
      PYSPARK_PYTHON: python3
    volumes:
      - ../src:/home/nhom05/work
      - ../data:/home/nhom05/data
    depends_on:
      - spark-master
      - namenode
      - kafka

# ─────────────────────────────────────────────────────────────
#  VOLUMES — persistent HDFS storage
# ─────────────────────────────────────────────────────────────
volumes:
  hadoop_namenode:
  hadoop_tmp:
  hadoop_datanode1:
  hadoop_datanode2:
