# ============================================================
#  spark-defaults.conf — Spark 4.1.1 cluster configuration
#  PATCH 7: Updated versions, Scala 2.13 package names
# ============================================================

# ── Cluster endpoints ────────────────────────────────────────
spark.master                                spark://spark-master:7077
spark.hadoop.fs.defaultFS                   hdfs://namenode:9000

# ── SQL warehouse ────────────────────────────────────────────
spark.sql.warehouse.dir                     hdfs://namenode:9000/user/hive/warehouse

# ── Memory and cores ─────────────────────────────────────────
spark.driver.memory                         2g
spark.executor.memory                       1g
spark.executor.cores                        2

# ── Shuffle partitions (50 is good for ~32M rows dataset) ────
spark.sql.shuffle.partitions                50

# ── Serializer ───────────────────────────────────────────────
spark.serializer                            org.apache.spark.serializer.KryoSerializer

# ── Adaptive Query Execution (Spark 3.0+) ────────────────────
spark.sql.adaptive.enabled                  true
spark.sql.adaptive.coalescePartitions.enabled   true

# ── Kafka integration package ────────────────────────────────
#  PATCH 2: Scala 2.13 suffix, version 4.1.1
spark.jars.packages                         org.apache.spark:spark-sql-kafka-0-10_2.13:4.1.1

# ── Network timeouts ─────────────────────────────────────────
spark.network.timeout                       300s
spark.executor.heartbeatInterval            60s

# ── UI history server ─────────────────────────────────────────
spark.eventLog.enabled                      true
spark.eventLog.dir                          hdfs://namenode:9000/spark-logs

# ── Dynamic allocation (off by default for predictable demo) ─
spark.dynamicAllocation.enabled             false
