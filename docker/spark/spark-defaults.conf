# ============================================================
#  spark-defaults.conf - Cấu hình mặc định cho Spark 4.1.1
#  Mô hình nhiều máy: Tăng thời gian chờ (timeout) để thích ứng độ trễ của Tailscale
# ============================================================

# --- Địa chỉ các dịch vụ trong Cluster ---
# Địa chỉ dự phòng - sẽ bị ghi đè bởi biến môi trường SPARK_MASTER trong Jupyter hoặc Worker
spark.master                                spark://spark-master:7077
spark.hadoop.fs.defaultFS                   hdfs://namenode:9000

# --- Thư mục lưu trữ dữ liệu SQL (SQL Warehouse) ---
spark.sql.warehouse.dir                     hdfs://namenode:9000/user/hive/warehouse

# --- Cấu hình bộ nhớ và số nhân CPU (Memory và Cores) ---
spark.driver.memory                         1g
spark.executor.memory                       2g
spark.executor.cores                        1

# --- Số lượng phân vùng khi thực hiện Shuffle (Shuffle Partitions) ---
spark.sql.shuffle.partitions                20

# --- Bộ tuần tự hóa dữ liệu (Serializer) ---
spark.serializer                            org.apache.spark.serializer.KryoSerializer

# --- Cơ chế tối ưu hóa truy vấn động (Adaptive Query Execution) ---
spark.sql.adaptive.enabled                  true
spark.sql.adaptive.coalescePartitions.enabled   true

# --- Thời gian chờ mạng (Network Timeouts) - Tăng để thích ứng độ trễ mạng Tailscale ---
# network.timeout: Thời gian tối đa chờ phản hồi trước khi coi executor đã mất kết nối
spark.network.timeout                       600s
# heartbeatInterval: Khoảng thời gian định kỳ gửi tín hiệu kiểm tra trạng thái hoạt động (heartbeat)
spark.executor.heartbeatInterval            120s
# rpc.askTimeout: Thời gian chờ phản hồi cho các yêu cầu RPC
spark.rpc.askTimeout                        300s
# worker.timeout: Thời gian chờ Spark Master đăng ký thành công Worker
spark.worker.timeout                        120

# --- Tự động phân bổ tài nguyên (Dynamic Allocation) - Tắt để dễ theo dõi và gỡ lỗi ---
spark.dynamicAllocation.enabled             false