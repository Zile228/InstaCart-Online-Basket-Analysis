# ============================================================
#  spark-defaults.conf — Spark 4.1.1 cluster configuration
#  Multi-machine: tăng timeout cho Tailscale latency
#
#  Lưu ý quan trọng:
#    spark.master và spark.hadoop.fs.defaultFS vẫn dùng hostname
#    "spark-master" và "namenode" — các container và Jupyter
#    resolve qua Docker bridge network (master) hoặc extra_hosts (worker).
#
#    Jupyter submit job với: SPARK_MASTER=spark://${MASTER_TS_IP}:7077
#    (env var này override spark.master trong file này)
#
#  GIỮ NGUYÊN từ config cũ (đã debug kỹ):
#    - Không bật spark.eventLog (HDFS dir chưa tồn tại → crash)
#    - Không để spark.jars.packages ở đây (dùng --packages khi submit)
#    - spark.dynamicAllocation.enabled = false (predictable cho demo)
# ============================================================

# ── Cluster endpoints ────────────────────────────────────────
# Fallback hostname — bị override bởi SPARK_MASTER env var trong Jupyter/Worker
spark.master                                spark://spark-master:7077
spark.hadoop.fs.defaultFS                   hdfs://namenode:9000

# ── SQL warehouse ────────────────────────────────────────────
spark.sql.warehouse.dir                     hdfs://namenode:9000/user/hive/warehouse

# ── Memory và cores ──────────────────────────────────────────
# Tăng executor memory từ 512m → 2g vì giờ mỗi worker là máy riêng
spark.driver.memory                         1g
spark.executor.memory                       2g
spark.executor.cores                        1

# ── Shuffle partitions ────────────────────────────────────────
spark.sql.shuffle.partitions                20

# ── Serializer ───────────────────────────────────────────────
spark.serializer                            org.apache.spark.serializer.KryoSerializer

# ── Adaptive Query Execution ─────────────────────────────────
spark.sql.adaptive.enabled                  true
spark.sql.adaptive.coalescePartitions.enabled   true

# ── Network timeouts — TĂNG cho Tailscale WAN latency ────────
# Tailscale: 10-50ms latency vs Docker bridge: 0.1ms
# network.timeout: bao lâu không phản hồi thì coi executor là dead
spark.network.timeout                       600s
# heartbeatInterval: executor gửi heartbeat mỗi bao lâu
spark.executor.heartbeatInterval            120s
# Thời gian chờ RPC response
spark.rpc.askTimeout                        300s
# Thời gian chờ Spark Master đăng ký Worker
spark.worker.timeout                        120

# ── Dynamic allocation (tắt cho demo dễ debug) ───────────────
spark.dynamicAllocation.enabled             false

# ── Kafka package: KHÔNG để ở đây (tải JAR mỗi lần submit) ──
# Dùng --packages khi submit streaming job:
#   spark-submit --packages org.apache.spark:spark-sql-kafka-0-10_2.13:4.1.1 ...
# Uncomment dòng dưới NẾU muốn tất cả job đều có Kafka sẵn:
# spark.jars.packages  org.apache.spark:spark-sql-kafka-0-10_2.13:4.1.1