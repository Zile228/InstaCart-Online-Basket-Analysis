# ============================================================
#  docker-compose.worker.yml
#  Chạy trên máy Worker 1 (Machine 2) hoặc máy Worker 2 (Machine 3)
#  Hệ thống: Hadoop DataNode - YARN NodeManager - Spark Worker
#
#  Cách khởi động:
#    ./script/start-worker.sh
#
#  Yêu cầu cấu hình trong file .env:
#    MASTER_TS_IP   - IP Tailscale của máy Master
#    WORKER_ID      - Điền 1 cho worker-1, điền 2 cho worker-2
#    WORKER_TS_IP   - IP Tailscale của chính máy Worker hiện tại
#    WORKER_MEM     - Dung lượng RAM cấp cho container (ví dụ: 4G)
#    WORKER_CORES   - Số nhân CPU cấp cho Spark Worker (ví dụ: 2)
#    YARN_MEM_MB    - Dung lượng RAM cấp cho YARN NodeManager bằng MB (ví dụ: 3072)
# ============================================================

networks:
  bigdata-net:
    driver: bridge   # Mạng (network) nội bộ trên máy Worker

# --- HADOOP DATANODE và YARN NodeManager ---
# Cần cấu hình extra_hosts "namenode" trỏ về MASTER_TS_IP để DataNode kết nối và đăng ký thành công với NameNode.
services:
  datanode:
    build:
      context: ./hadoop
      dockerfile: Dockerfile
      args:
        # Trùng khớp với giá trị trên máy Master để đồng nhất thông số replication
        DFS_REPLICATION: "${DFS_REPLICATION:-1}"
    image: instacart-hadoop:3.4.3
    container_name: datanode-${WORKER_ID:-1}
    # Định danh tên máy dạng datanode1 hoặc datanode2 để NameNode phân biệt
    hostname: datanode${WORKER_ID:-1}
    ports:
      - "${DN_HTTP_PORT:-9864}:${DN_HTTP_PORT:-9864}"   # DataNode Web UI - Địa chỉ: http://WORKER_TS_IP:986x
      - "${DN_XFER_PORT:-9866}:${DN_XFER_PORT:-9866}"   # Cổng truyền dữ liệu DataNode (cho client đọc/ghi HDFS)
      - "${DN_IPC_PORT:-9867}:${DN_IPC_PORT:-9867}"     # Cổng DataNode IPC
      - "8042:8042"   # NodeManager Web UI - Địa chỉ: http://WORKER_TS_IP:8042
    extra_hosts:
      # Phân giải tên miền "namenode" về IP Tailscale của máy Master
      - "namenode:${MASTER_TS_IP}"
    environment:
      HADOOP_ROLE: datanode
      # Kiểm tra cổng hoạt động của NameNode trước khi khởi chạy
      SERVICE_PRECONDITION: "${MASTER_TS_IP}:9870"
      # Thiết lập dung lượng RAM cho NodeManager
      YARN_NODEMANAGER_RESOURCE_MEMORY_MB: "${YARN_MEM_MB:-3072}"
      # IP Tailscale của chính máy Worker này để đăng ký chính xác với NameNode
      DATANODE_HOST: "${WORKER_TS_IP}"
      # Mã định danh máy Worker để tính toán cổng kết nối tương ứng
      WORKER_ID: "${WORKER_ID:-1}"
      DN_XFER_PORT: "${DN_XFER_PORT:-}"
      DN_HTTP_PORT: "${DN_HTTP_PORT:-}"
      DN_IPC_PORT: "${DN_IPC_PORT:-}"
    volumes:
      - hadoop_datanode:/hadoop/dfs/data
      # Sao chép các tệp cấu hình cần thiết dạng chỉ đọc (Read-Only) vào container
      - ./hadoop/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./hadoop/yarn-site.xml:/opt/hadoop/etc/hadoop/yarn-site.xml:ro
      - ./hadoop/mapred-site.xml:/opt/hadoop/etc/hadoop/mapred-site.xml:ro
    mem_limit: ${WORKER_MEM:-4G}
    memswap_limit: ${WORKER_MEM:-4G}
    networks:
      - bigdata-net

# --- SPARK WORKER ---
# Khởi chạy Spark Worker để liên lạc và nhận công việc phân bổ từ Spark Master
  spark-worker:
    build:
      context: ./spark
      dockerfile: Dockerfile
    image: instacart-spark:4.1.1
    container_name: spark-worker-${WORKER_ID:-1}
    hostname: spark-worker-${WORKER_ID:-1}
    ports:
      - "${SPARK_WORKER_PORT:-8081}:8081"
      - "4042:4042"    # Cổng BlockManager để Driver lấy dữ liệu Shuffle
      - "4041:4041"    # Cổng Executor dự phòng khi cần thiết
    extra_hosts:
      # Phân giải các hostname hệ thống về dải địa chỉ IP tương ứng
      - "spark-master:${MASTER_TS_IP}"
      - "namenode:${MASTER_TS_IP}"
      - "datanode1:${WORKER1_TS_IP}"
      - "datanode2:${WORKER2_TS_IP}"
    environment:
      SPARK_MODE: worker
      # Địa chỉ kết nối Spark Master qua IP Tailscale của máy Master
      SPARK_MASTER_URL: spark://${MASTER_TS_IP}:7077
      SPARK_WORKER_MEMORY: ${WORKER_MEM:-4G}
      SPARK_WORKER_CORES: "${WORKER_CORES:-2}"
      SPARK_WORKER_WEBUI_PORT: 8081
    volumes:
      - ./spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    mem_limit: ${WORKER_MEM:-4G}
    memswap_limit: ${WORKER_MEM:-4G}
    depends_on:
      - datanode
    networks:
      - bigdata-net

# --- Cấu hình vùng lưu trữ dữ liệu bền vững (Volumes) ---
volumes:
  hadoop_datanode: