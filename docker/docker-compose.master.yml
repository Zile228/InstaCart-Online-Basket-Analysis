# ============================================================
#  docker-compose.master.yml
#  Chạy trên máy Master (Machine 1)
#  Hệ thống: Hadoop 3.4.3 - Spark 4.1.1 - Jupyter
#
#  Cách khởi động:
#    ./script/start-master.sh
#    ./script/start-master.sh --with-virtual-worker
#
#  Yêu cầu:
#    - File .env đã khai báo đúng MASTER_TS_IP
#    - Tailscale đang chạy trên máy này
# ============================================================

networks:
  bigdata-net:
    driver: bridge   # Mạng (network) nội bộ trên máy Master

# --- HADOOP NAMENODE và YARN ResourceManager ---
# Các cổng 9000 và 8032 cần expose ra ngoài máy thật (host) để Worker kết nối qua Tailscale
services:
  namenode:
    build:
      context: ./hadoop
      dockerfile: Dockerfile
      args:
        # Truyền tham số DFS_REPLICATION vào file hdfs-site.xml lúc build
        DFS_REPLICATION: "${DFS_REPLICATION:-1}"
    image: instacart-hadoop:3.4.3
    container_name: namenode
    hostname: namenode
    ports:
      - "9870:9870"   # NameNode Web UI - Địa chỉ: http://MASTER_TS_IP:9870
      - "9000:9000"   # HDFS RPC - Nơi các Worker DataNode kết nối vào
      - "8088:8088"   # YARN ResourceManager Web UI - Địa chỉ: http://MASTER_TS_IP:8088
      - "8032:8032"   # YARN ResourceManager Scheduler - Nơi Worker NodeManager kết nối đăng ký
      - "8030:8030"   # YARN RM Resource Scheduler - Cần thiết cho NodeManager khác máy
      - "8031:8031"   # YARN RM Resource Tracker - Nơi NodeManager đăng ký tài nguyên
    networks:
      - bigdata-net
    # Phân giải chính xác tên máy datanode1 và datanode2 về IP Tailscale tương ứng để tránh trùng lặp IP khi NAT
    extra_hosts:
      - "datanode1:${WORKER1_TS_IP:-127.0.0.1}"
      - "datanode2:${WORKER2_TS_IP:-127.0.0.1}"
    environment:
      HADOOP_ROLE: namenode
      HDFS_NAMENODE: hdfs://namenode:9000
    volumes:
      - hadoop_namenode:/hadoop/dfs/name
      - hadoop_tmp:/hadoop/tmp
    mem_limit: 1536m
    memswap_limit: 1536m
    healthcheck:
      test: ["CMD", "hdfs", "dfsadmin", "-safemode", "get"]
      interval: 30s
      timeout: 10s
      retries: 5

# --- SPARK MASTER ---
# Cổng 7077 cần expose ra ngoài máy thật để Worker Spark kết nối qua Tailscale
  spark-master:
    build:
      context: ./spark
      dockerfile: Dockerfile
    image: instacart-spark:4.1.1
    container_name: spark-master
    hostname: spark-master
    ports:
      - "8080:8080"   # Spark Web UI - Địa chỉ: http://MASTER_TS_IP:8080
      - "7077:7077"   # Spark RPC - Nơi Worker Spark kết nối vào
      - "4040:4040"   # Giao diện ứng dụng (chỉ hiển thị khi có Job đang chạy)
    networks:
      - bigdata-net
    environment:
      SPARK_MODE: master
      SPARK_MASTER_HOST: spark-master
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
    volumes:
      - ./spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    mem_limit: 1g
    memswap_limit: 1g

# --- JUPYTER NOTEBOOK ---
# Thiết lập extra_hosts để Jupyter phân giải tên máy (hostname) của các DataNode trên máy Worker
  jupyter:
    build:
      context: ./jupyter
      dockerfile: Dockerfile
    image: instacart-jupyter:latest
    container_name: jupyter
    hostname: jupyter
    ports:
      - "8888:8888"   # Jupyter UI - Địa chỉ: http://MASTER_TS_IP:8888
      - "4041:4041"   # Cổng spark.driver.port để Executor kết nối từ xa về Driver
      - "4042:4042"   # Cổng spark.blockManager.port
      - "4043:4040"
    networks:
      - bigdata-net
    # Phân giải tên máy DataNode của các máy Worker
    extra_hosts:
      - "datanode1:${WORKER1_TS_IP:-127.0.0.1}"
      - "datanode2:${WORKER2_TS_IP:-127.0.0.1}"
    environment:
      # Địa chỉ kết nối Spark Master qua IP Tailscale
      SPARK_MASTER: spark://${MASTER_TS_IP}:7077
      MASTER_TS_IP: ${MASTER_TS_IP} 
      HDFS_NAMENODE: hdfs://namenode:9000
      PYSPARK_PYTHON: python3
    volumes:
      - ../src:/home/nhom05/work
      - ../data:/home/nhom05/data
    depends_on:
      - spark-master
      - namenode
    mem_limit: ${JUPYTER_MEM:-8g}
    memswap_limit: ${JUPYTER_MEM:-8g}

# --- VIRTUAL DATANODE (Mô phỏng Worker nội bộ) - Profile: virtual-worker ---
# Sử dụng khi chạy thử nghiệm độc lập trên một máy Master
  virtual-datanode:
    profiles: ["virtual-worker"]
    image: instacart-hadoop:3.4.3
    container_name: virtual-datanode
    hostname: datanode1        # Dùng hostname datanode1 để tương thích
    networks:
      - bigdata-net
    environment:
      HADOOP_ROLE: datanode
      SERVICE_PRECONDITION: "namenode:9870"
    volumes:
      - hadoop_virtual_datanode:/hadoop/dfs/data
    mem_limit: ${VIRTUAL_WORKER_MEM:-512m}
    memswap_limit: ${VIRTUAL_WORKER_MEM:-512m}
    depends_on:
      - namenode

# --- VIRTUAL SPARK WORKER - Profile: virtual-worker ---
# Chạy trực tiếp qua mạng nội bộ Docker Bridge
  virtual-spark-worker:
    profiles: ["virtual-worker"]
    image: instacart-spark:4.1.1
    container_name: virtual-spark-worker
    hostname: virtual-spark-worker
    ports:
      - "8083:8081"   # Spark Worker Web UI (Dùng cổng 8083 để tránh trùng lặp)
    networks:
      - bigdata-net
    environment:
      SPARK_MODE: worker
      # Sử dụng hostname spark-master trực tiếp do nằm cùng dải mạng nội bộ Docker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: ${VIRTUAL_WORKER_MEM:-512m}
      SPARK_WORKER_CORES: "${VIRTUAL_WORKER_CORES:-1}"
      SPARK_WORKER_WEBUI_PORT: 8081
    volumes:
      - ./spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
    mem_limit: ${VIRTUAL_WORKER_MEM:-512m}
    memswap_limit: ${VIRTUAL_WORKER_MEM:-512m}
    depends_on:
      - spark-master

# --- Cấu hình vùng lưu trữ dữ liệu bền vững (Volumes) ---
volumes:
  hadoop_namenode:
  hadoop_tmp:
  hadoop_virtual_datanode:   # Sử dụng khi kích hoạt chế độ virtual-worker