# ============================================================
#  spark-defaults.conf — Spark local mode
#  Không có spark-master/worker riêng → local[*]
# ============================================================

# ── Master: local mode ───────────────────────────────────────
spark.master                                local[*]
spark.hadoop.fs.defaultFS                   hdfs://namenode:9000

# ── SQL warehouse ────────────────────────────────────────────
spark.sql.warehouse.dir                     hdfs://namenode:9000/user/hive/warehouse

# ── Memory ───────────────────────────────────────────────────
# Driver = Jupyter process, executor cũng chạy trong cùng JVM (local mode)
spark.driver.memory                         1500m
spark.executor.memory                       1500m

# ── Shuffle partitions ────────────────────────────────────────
# Giảm mạnh xuống vì chỉ 1 node
spark.sql.shuffle.partitions                4

# ── Serializer ───────────────────────────────────────────────
spark.serializer                            org.apache.spark.serializer.KryoSerializer

# ── Adaptive Query Execution ─────────────────────────────────
spark.sql.adaptive.enabled                  true
spark.sql.adaptive.coalescePartitions.enabled   true

# ── Timeouts (local mode → không cần lớn) ───────────────────
spark.network.timeout                       120s
spark.executor.heartbeatInterval            10s
