# File spark-defaults.conf - Cau hinh mac dinh cho Spark o che do local mode
# Khong su dung cum master/worker rieng le ma chay truc tiep tren tat ca cac core cua may (local[*])

# Thiet lap chay local va duong dan mac dinh ket noi den NameNode cua HDFS
spark.master                                local[*]
spark.driver.host                           localhost
spark.hadoop.fs.defaultFS                   hdfs://namenode:9000

# Duong dan thu muc luu tru du lieu cho Spark SQL
spark.sql.warehouse.dir                     hdfs://namenode:9000/user/hive/warehouse

# Thiet lap dung luong bo nho (RAM) cho Driver va Executor
# Vi dang chay o local mode nen ca Driver va Executor deu se nam chung trong cung mot tien trinh JVM
spark.driver.memory                         1500m
spark.executor.memory                       1500m

# Giam so partition luc shuffle xuong con 4 vi he thong chi chay tren 1 node
spark.sql.shuffle.partitions                4

# Dung KryoSerializer de tang toc do tuan tu hoa du lieu (serialization)
spark.serializer                            org.apache.spark.serializer.KryoSerializer

# Kich hoat tinh nang tu dong toi uu hoa cau truy van (Adaptive Query Execution)
spark.sql.adaptive.enabled                  true
spark.sql.adaptive.coalescePartitions.enabled   true

# Thoi gian timeout ket noi mang va gui tin hieu heartbeat giua cac tien trinh
spark.network.timeout                       120s
spark.executor.heartbeatInterval            10s